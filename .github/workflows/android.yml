name: Build Android TV APK

# Builds the Glass Launcher APK for Android TV / Google TV (Philips, Sony, etc.)
# on GitHub's servers, which already have the Android SDK. The finished APK is
# attached to the run as an artifact and to a release named "android-latest".

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tv-launcher/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync web UI into the app
        run: |
          rm -rf android/app/src/main/assets/css android/app/src/main/assets/js \
                 android/app/src/main/assets/index.html
          cp -r tv-launcher/index.html tv-launcher/css tv-launcher/js \
                tv-launcher/icon.png tv-launcher/largeIcon.png \
                android/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk glass-launcher-androidtv.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: glass-launcher-androidtv
          path: glass-launcher-androidtv.apk

      - name: Publish to android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Glass Launcher (Android TV) — latest
          files: glass-launcher-androidtv.apk
          body: |
            Latest Android TV / Google TV build of Glass Launcher.
            Install on the TV with: `adb install -r glass-launcher-androidtv.apk`
