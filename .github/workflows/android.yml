name: Build Android TV APK

# Builds the Glass Launcher APK for Android TV / Google TV (Philips, Sony, etc.)
# on GitHub's servers, which already have the Android SDK. The finished APK is
# attached to the run as an artifact and to a release named "android-latest".

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tv-launcher/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GLASS_DEBUG_KEYSTORE: ${{ github.workspace }}/.glass-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check TV layout and navigation
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          SCREENSHOT_PATH=preview.png node android-ui.cjs

      - name: Save layout preview
        uses: actions/upload-artifact@v4
        with:
          name: glass-layout-preview
          path: tests/preview.png

      - name: Sync web UI into the app
        run: |
          rm -rf android/app/src/main/assets/css android/app/src/main/assets/js \
                 android/app/src/main/assets/index.html
          cp -r tv-launcher/index.html tv-launcher/css tv-launcher/js \
                tv-launcher/icon.png tv-launcher/largeIcon.png \
                android/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Home button routing policy
        run: |
          mkdir -p "$RUNNER_TEMP/glass-policy-tests"
          javac -d "$RUNNER_TEMP/glass-policy-tests" android/app/src/main/java/house/hueco/glass/HomeButtonPolicy.java tests/HomeButtonPolicyTest.java
          java -cp "$RUNNER_TEMP/glass-policy-tests" house.hueco.glass.HomeButtonPolicyTest

      - name: Keep debug signing identity between builds
        uses: actions/cache@v4
        with:
          path: .glass-signing/debug.keystore
          key: glass-debug-signing-v2

      - name: Prepare debug signing key
        run: |
          mkdir -p "$(dirname "$GLASS_DEBUG_KEYSTORE")"
          if [ ! -f "$GLASS_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$GLASS_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug lintDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk glass-launcher-androidtv.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: glass-launcher-androidtv
          path: glass-launcher-androidtv.apk

      - name: Publish to android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Glass Launcher (Android TV) — latest
          files: glass-launcher-androidtv.apk
          body: |
            Latest Android TV / Google TV build of Glass Launcher.
            Version 1.2.0 adds an optional Accessibility Home button fix for TVs that ignore
            the default Home setting. Enable Glass Home button in Android Accessibility settings.
            This is a debug build. If upgrading from an older build reports a signing conflict,
            uninstall the old Glass app first, then install this APK.
            Install on the TV with: `adb install -r glass-launcher-androidtv.apk`
