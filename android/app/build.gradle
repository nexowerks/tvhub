plugins { id 'com.android.application' }

android {
    namespace 'house.hueco.glass'
    compileSdk 34

    defaultConfig {
        applicationId "house.hueco.glass"
        minSdk 22            // Android TV 5.1+ covers virtually all Philips Android sets
        targetSdk 34
        versionCode 3
        versionName "1.2.0"
    }

    signingConfigs {
        debug {
            if (System.getenv('GLASS_DEBUG_KEYSTORE')) {
                storeFile file(System.getenv('GLASS_DEBUG_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
